# Configuration Netlify — AC SAT Campagne
#
# Pourquoi ce fichier est indispensable :
# le fichier d'accueil du projet s'appelle "Index.html" avec un I MAJUSCULE.
# Netlify sert les fichiers depuis Linux, où la casse compte, et cherche
# "index.html" en minuscules à la racine. Sans la règle ci-dessous, l'adresse
# du site renverrait une erreur 404 alors que toutes les autres pages
# fonctionneraient — panne difficile à diagnostiquer.

[build]
  # Aucune compilation : le projet est du HTML/CSS/JS servi tel quel.
  publish = "."
  command = ""

# L'adresse racine sert la page d'accueil.
[[redirects]]
  from = "/"
  to = "/Index.html"
  status = 200
  force = true

# Fichiers de développement : présents dans le dossier publié, mais JAMAIS servis au public.
# Chaque adresse renvoie la page 404. Le test Tests/test25.js échoue si un nouveau fichier de
# développement est ajouté à la racine sans règle ici.
[[redirects]]
  from = "/Tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/envoyer.bat"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/envoyer-auto.bat"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.editorconfig"
  to = "/404.html"
  status = 404
  force = true

# En-têtes de sécurité standard.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Politique de sécurité du contenu : aucun script en ligne (script-src 'self'), seuls Supabase et geo.api.gouv.fr (commune d'un code postal) sont joignables.
    # Les styles en ligne restent permis : l'interface en génère beaucoup. Toute nouvelle adresse externe DOIT être ajoutée ici (connect-src).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; connect-src 'self' https://btzqjbmfkzhdtltgtrob.supabase.co wss://btzqjbmfkzhdtltgtrob.supabase.co https://geo.api.gouv.fr; worker-src 'self'; manifest-src 'self'; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Les bibliothèques de Vendor (Supabase, fflate) ne changent jamais : mise en cache longue.
[[headers]]
  for = "/Vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le code de l'application, lui, ne doit pas rester en cache :
# c'est ce qui fait qu'une mise à jour ne se voit pas.
[[headers]]
  for = "/Js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/CSS/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vidéo d'ouverture : ne change presque jamais (renommer le fichier pour la remplacer).
[[headers]]
  for = "/Media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

# Numéro de version publié : jamais en cache (l'application le compare à sa propre version pour proposer la mise à jour).
[[headers]]
  for = "/version.*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
