<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Page introuvable · AC SAT Campagne</title>
<link rel="icon" href="/Images/icone-192.png">
<style>
  /* Page autonome : chemins absolus (elle est servie à la place de plusieurs adresses), aucun script. */
  :root { --fond: #000000; --texte: #ffffff; --discret: #aeadb2; --accent: #f9423d; --sur-accent: #1a1213; }
  @media (prefers-color-scheme: light) {
    :root { --fond: #f9f8fb; --texte: #1c1517; --discret: #5f5658; --accent: #d40c1a; --sur-accent: #ffffff; }
  }
  html, body { margin: 0; min-height: 100%; background: var(--fond); color: var(--texte);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { box-sizing: border-box; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 6px 0 0; font-size: 1.6rem; line-height: 1.2; }
  p { margin: 0; max-width: 28rem; line-height: 1.5; color: var(--discret); overflow-wrap: anywhere; }
  a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 10px; padding: 0 24px;
    border-radius: 12px; background: var(--accent); color: var(--sur-accent); font-size: 1rem; font-weight: 700; text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--texte); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/Images/logo.png" alt="" width="72" height="72">
  <h1>Page introuvable</h1>
  <p>Cette adresse n'existe pas, ou elle n'est pas publique.</p>
  <a href="/Index.html">Retour à l'application</a>
</main>
</body>
</html>
